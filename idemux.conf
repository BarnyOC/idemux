# SPDX-License-Identifier: MIT
# idemux — barebones IDE tmux configuration.
#
# This file is loaded by the `idemux` script on its own dedicated tmux server
# (tmux -L idemux). The script sets IDEMUX_BIN in the server environment,
# which the bindings below use to call back into the CLI.

# ---------------------------------------------------------------- terminal

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g set-clipboard on

# ---------------------------------------------------------------- windows

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
setw -g allow-rename off

# ---------------------------------------------------------------- pane chrome

set -g pane-border-status top
set -g pane-border-format ' #{pane_title} '
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=green'

# ---------------------------------------------------------------- status bar

set -g status-position top
set -g status-style 'bg=colour25 fg=colour255'
set -g status-left ' #[bold]idemux#[default] '
set -g status-left-length 10

# Hotkey hints on the right, followed by the clock. Keys are highlighted so the
# bar doubles as a cheat sheet for the bindings below.
set -g status-right ' #[fg=colour153]prefix+Tab#[default] switch pane  #[fg=colour153]prefix+g#[default] editor/git  #[fg=colour153]prefix+a#[default] agent/terminal  #[fg=colour153]prefix+o#[default] open repo  #[fg=colour153]prefix+X#[default] close repo  #[fg=colour153]prefix+r#[default] reload idemux  #[fg=colour153]%H:%M '
set -g status-right-length 160

set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'fg=colour25,bg=colour153,bold'
set -g window-status-activity-style 'fg=yellow'

# ---------------------------------------------------------------- prefix
set -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# ---------------------------------------------------------------- IDE keys

# Move focus to the other pane (left <-> right).
bind-key Tab select-pane -t :.+

# Swap the left pane between the editor and lazygit.
bind-key g run-shell '"$IDEMUX_BIN" toggle-left #{window_id}'

# Swap the right pane between the coding agent and a plain shell.
bind-key a run-shell '"$IDEMUX_BIN" toggle-right #{window_id}'

# Pick one or more repos from the configured roots and open them.
bind-key o display-popup -E -w 80% -h 70% '"$IDEMUX_BIN" pick'

# Close the current repo window (and its parked panes).
# Bind both cases: the backtick prefix makes it easy to miss the shift, and
# tmux's default prefix+x would otherwise silently kill a single pane.
# The nested quoting keeps confirm-before's single command argument intact.
bind-key X confirm-before -p "Close repo '#W'? (y/n)" \
  "run-shell '\"\$IDEMUX_BIN\" close #{window_id}'"
bind-key x confirm-before -p "Close repo '#W'? (y/n)" \
  "run-shell '\"\$IDEMUX_BIN\" close #{window_id}'"

# Re-source this file after editing it.
bind-key r run-shell '"$IDEMUX_BIN" reload'

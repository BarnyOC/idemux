# tmux-ide — barebones IDE tmux configuration.
#
# This file is loaded by the `ide` script on its own dedicated tmux server
# (tmux -L tmux-ide). The script sets TMUX_IDE_BIN in the server environment,
# which the bindings below use to call back into the CLI.

# ---------------------------------------------------------------- terminal

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g set-clipboard on

# ---------------------------------------------------------------- windows

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
setw -g allow-rename off

# ---------------------------------------------------------------- pane chrome

set -g pane-border-status top
set -g pane-border-format ' #{pane_title} '
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=green'

# ---------------------------------------------------------------- status bar

set -g status-position top
set -g status-style 'bg=colour25 fg=colour255'
set -g status-left ' #[bold]ide#[default] '
set -g status-left-length 8

# Hotkey hints on the right, followed by the clock. Keys are highlighted so the
# bar doubles as a cheat sheet for the bindings below.
set -g status-right ' #[fg=colour153]prefix+Tab#[default] switch pane  #[fg=colour153]prefix+g#[default] editor/git  #[fg=colour153]prefix+a#[default] agent/terminal  #[fg=colour153]prefix+o#[default] open repo  #[fg=colour153]prefix+X#[default] close repo  #[fg=colour153]prefix+Shift+r#[default] reload ide  #[fg=colour153]%H:%M '
set -g status-right-length 160

set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'fg=colour25,bg=colour153,bold'
set -g window-status-activity-style 'fg=yellow'

# ---------------------------------------------------------------- prefix

# Use Ctrl+backtick as the prefix. Most terminals send the same byte (NUL) for
# Ctrl+backtick as for Ctrl+Space, which tmux names C-Space, so bind that as a
# secondary prefix too. Terminals with extended key reporting send C-` itself.
set -g prefix 'C-`'
set -g prefix2 C-Space
unbind-key C-b
unbind-key '`'
bind-key 'C-`' send-prefix
bind-key C-Space send-prefix -2

# ---------------------------------------------------------------- IDE keys

# Move focus to the other pane (left <-> right).
bind-key Tab select-pane -t :.+

# Swap the left pane between the editor and lazygit.
bind-key g run-shell '"$TMUX_IDE_BIN" toggle-left #{window_id}'

# Swap the right pane between the coding agent and a plain shell.
bind-key a run-shell '"$TMUX_IDE_BIN" toggle-right #{window_id}'

# Pick one or more repos from the configured roots and open them.
bind-key o display-popup -E -w 80% -h 70% '"$TMUX_IDE_BIN" pick'

# Close the current repo window (and its parked panes).
# Bind both cases: the backtick prefix makes it easy to miss the shift, and
# tmux's default prefix+x would otherwise silently kill a single pane.
# The nested quoting keeps confirm-before's single command argument intact.
bind-key X confirm-before -p "Close repo '#W'? (y/n)" \
  "run-shell '\"\$TMUX_IDE_BIN\" close #{window_id}'"
bind-key x confirm-before -p "Close repo '#W'? (y/n)" \
  "run-shell '\"\$TMUX_IDE_BIN\" close #{window_id}'"

# Re-source this file after editing it.
bind-key R run-shell '"$TMUX_IDE_BIN" reload'
